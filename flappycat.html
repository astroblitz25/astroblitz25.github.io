<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Cat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .game-container {
            padding: 20px;
            background: rgba(255, 192, 203, 0.75); /* Semi-transparent pink */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        canvas {
            display: block;
            border-radius: 10px;
        }

        .back-button-container {
            position: fixed;
            bottom: 12px; /* Moved down */
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .back-button-container a {
            display: block;
            transition: transform 0.2s ease;
        }

        .back-button-container img {
            width: 120px; /* Increased size */
            height: auto;
            display: block;
        }

        .back-button-container a:hover {
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <!-- Background video -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="bgcutezones.mp4" type="video/mp4">
    </video>

    <!-- Game Box -->
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <!-- Back Button -->
    <div class="back-button-container">
        <a href="cutezones.html" title="Go back to Cute Zones">
            <img src="hd99.gif" alt="Go Back">
        </a>
    </div>

    <script>
        // Game setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game variables
        let catY, catVelocity, score, highScore, frame;
        let pipes = [];
        let gameState = 'start'; // 'start', 'playing', 'over'

        // Game constants adjusted for new size
        const catX = 80;
        const catWidth = 45;
        const catHeight = 35;
        const gravity = 0.35;
        const flapStrength = -6;
        const pipeWidth = 60;
        const pipeGap = 160;
        const pipeInterval = 100; // frames between new pipes
        const pipeSpeed = 2.5;

        // Load cat image
        const catImg = new Image();
        catImg.src = 'flappycat.gif';

        // Pipe colors
        const pipeColor = "#ff85a2"; // Main pipe color
        const pipeBorderColor = "#ff6b8f"; // Pipe outline color

        function initialize() {
            catY = canvas.height / 2;
            catVelocity = 0;
            score = 0;
            // Use sessionStorage to keep score only for the current browser tab session
            highScore = sessionStorage.getItem('flappyCatHighScore') || 0;
            pipes = [];
            frame = 0;
            gameState = 'start';
            draw(); // Draw the initial start screen
        }

        function handleInput() {
            switch (gameState) {
                case 'start':
                    gameState = 'playing';
                    catVelocity = flapStrength;
                    gameLoop();
                    break;
                case 'playing':
                    catVelocity = flapStrength;
                    break;
                case 'over':
                    initialize(); // Resets the game to the start screen
                    break;
            }
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent page from scrolling
                handleInput();
            }
        });
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent click event from firing as well
            handleInput();
        });

        function gameLoop() {
            if (gameState !== 'playing') return;

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function update() {
            // Cat physics
            catVelocity += gravity;
            catY += catVelocity;
            frame++;

            // Check for game over (collision with top/bottom)
            if (catY + catHeight > canvas.height || catY < 0) {
                gameState = 'over';
                updateHighScore();
                return; // Stop the update loop
            }

            // Generate pipes
            if (frame % pipeInterval === 0) {
                const pipeY = Math.floor(Math.random() * (canvas.height - pipeGap - 150)) + 75;
                pipes.push({ x: canvas.width, y: pipeY, passed: false });
            }

            // Move and check pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= pipeSpeed;

                // Collision detection
                if (catX < p.x + pipeWidth &&
                    catX + catWidth > p.x &&
                    (catY < p.y || catY + catHeight > p.y + pipeGap)) {
                    gameState = 'over';
                    updateHighScore();
                    return; // Stop the update loop
                }

                // Score
                if (p.x + pipeWidth < catX && !p.passed) {
                    score++;
                    p.passed = true;
                }

                // Remove pipes that are off-screen
                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function updateHighScore() {
            if (score > highScore) {
                highScore = score;
                sessionStorage.setItem('flappyCatHighScore', highScore);
            }
        }

        function draw() {
            // Clear canvas with a subtle pink tint
            ctx.fillStyle = 'rgb(255, 240, 245)'; // Opaque color to prevent "echo" effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw pipes (visible in playing and game over states)
            if (gameState === 'playing' || gameState === 'over') {
                ctx.fillStyle = pipeColor;
                ctx.strokeStyle = pipeBorderColor;
                ctx.lineWidth = 4;
                for (let p of pipes) {
                    ctx.fillRect(p.x, 0, pipeWidth, p.y);
                    ctx.strokeRect(p.x, 0, pipeWidth, p.y);
                    ctx.fillRect(p.x, p.y + pipeGap, pipeWidth, canvas.height - p.y - pipeGap);
                    ctx.strokeRect(p.x, p.y + pipeGap, pipeWidth, canvas.height - p.y - pipeGap);
                }
            }

            // Draw cat
            ctx.save();
            // Translate to the cat's top-right corner, flip the context, and draw
            ctx.translate(catX + catWidth, catY);
            ctx.scale(-1, 1);
            ctx.drawImage(catImg, 0, 0, catWidth, catHeight);
            ctx.restore();

            // Draw text based on the current game state
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';

            if (gameState === 'start') {
                ctx.fillStyle = '#ff85a2'; // Pink color for instruction text
                ctx.font = '22px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText('Click or press Space to play', canvas.width / 2, canvas.height / 2 + 70);
            } else if (gameState === 'playing') {
                ctx.font = '48px "Comic Sans MS", cursive, sans-serif';
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 5;
                ctx.strokeText(score, canvas.width / 2, 70);
                ctx.fillText(score, canvas.width / 2, 70);
            } else if (gameState === 'over') {
                // Draw the game over screen on top
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'white';
                ctx.font = '48px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 90);

                ctx.font = '30px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 - 35);
                ctx.fillText(`High Score: ${highScore}`, canvas.width / 2, canvas.height / 2 + 15);

                ctx.fillStyle = '#ff85a2'; // Pink color for instruction text
                ctx.font = '22px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText('Click or press Space to play', canvas.width / 2, canvas.height / 2 + 70);
            }
        }

        // Start the game
        catImg.onload = initialize;

    </script>

</body>
</html>

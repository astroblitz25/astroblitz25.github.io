        }

        function drawSnowflake(x, y, r, rot, type) {
            if (type === 'dot') { ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); return; }
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            if (type === 'hexagon') {
                for (let i = 0; i < 6; i++) {
                    ctx.lineTo(r * Math.cos(i * Math.PI / 3), r * Math.sin(i * Math.PI / 3));
                }
                ctx.closePath();
            } else if (type === 'dendrite') {
                for (let i = 0; i < 6; i++) {
                    ctx.save();
                    ctx.rotate(i * Math.PI / 3);
                    ctx.moveTo(0, 0); ctx.lineTo(0, r);
                    ctx.moveTo(0, r * 0.3); ctx.lineTo(-r * 0.15, r * 0.45);
                    ctx.moveTo(0, r * 0.3); ctx.lineTo(r * 0.15, r * 0.45);
                    ctx.moveTo(0, r * 0.6); ctx.lineTo(-r * 0.2, r * 0.75);
                    ctx.moveTo(0, r * 0.6); ctx.lineTo(r * 0.2, r * 0.75);
                    ctx.moveTo(0, r); ctx.lineTo(-r * 0.1, r * 0.9);
                    ctx.moveTo(0, r); ctx.lineTo(r * 0.1, r * 0.9);
                    ctx.restore();
                }
            } else if (type === 'asterisk') {
                for (let i = 0; i < 6; i++) {
                    ctx.save();
                    ctx.rotate(i * Math.PI / 3);
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, r);
                    ctx.restore();
                }
            }
            ctx.stroke();
            ctx.restore();
        }

        function setupBackgroundPowerUpDraw() {
            const type = activePowerUp.type;
            const data = activePowerUp.data;
            
            backgroundPowerUpLayer.draw = () => {
                ctx.save();
                switch (type) {
                    case 'rainbow':
                        const colors = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff'];
                        ctx.globalAlpha = data.alpha; ctx.lineWidth = 6;
                        for (let i = 0; i < colors.length; i++) {
                            ctx.strokeStyle = colors[i];
                            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height, 250 - i * 5, Math.PI, Math.PI * 2); ctx.stroke();
                        }
                        break;
                    case 'cloud_text':                        
                        if (data.alpha > 0) {
                            ctx.font = 'bold 30px "Comic Sans MS", cursive, sans-serif'; ctx.textAlign = 'center';
                            const text = "Can I Finger You?"; const x = canvas.width / 2; const y = 150;
                            const bobble = Math.sin(frame * 0.05) * 2;
                            ctx.save();
                            ctx.globalAlpha = (data.alpha - 0.5) * 2;
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.filter = 'blur(8px)'; ctx.fillText(text, x, y + bobble);
                            ctx.filter = 'blur(4px)'; ctx.fillText(text, x, y + bobble);
                            ctx.filter = 'none'; ctx.fillStyle = `rgba(255, 255, 255, 1)`; ctx.fillText(text, x, y + bobble);
                            ctx.restore();
                        }
                        break;
                    case 'fire':
                        data.fireParticles.forEach(p => {
                            if (p.color === 'smoke') {
                                ctx.fillStyle = `rgba(100, 100, 100, ${p.life * 0.4})`;
                            } else {
                                ctx.fillStyle = p.color;
                            }
                            ctx.globalAlpha = p.life;
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                        });
                        ctx.globalAlpha = 1;
                        data.people.forEach(p => {
                            if (p.on_fire && p.fire_particles) {
                                ctx.save();
                                ctx.translate(p.x, p.y - 10); // Approx center
                                p.fire_particles.forEach(fp => {
                                    ctx.fillStyle = `rgba(255, ${Math.random() * 150}, 0, ${fp.life})`;
                                    ctx.beginPath(); ctx.arc(fp.x, fp.y, fp.size, 0, Math.PI * 2); ctx.fill();
                                });
                                ctx.restore();
                            }
                            drawStickPerson(p.x, p.y, frame, p.state, p.burn_progress || 0);
                            if (p.state === 'ash' && p.ash_particles) {
                                p.ash_particles.forEach(ap => {
                                    ctx.fillStyle = `rgba(80, 80, 80, ${ap.alpha})`;
                                    ctx.fillRect(ap.x, ap.y, ap.size, ap.size);
                                });
                            }
                        });
                        break;
                }
                ctx.restore();
            };
        }

        function drawForegroundPowerUp() {
            if (activePowerUp.type === 'none') return;
            const data = activePowerUp.data;
            ctx.save();
            switch (activePowerUp.type) {
                case 'light_rain':
                case 'heavy_rain':
                    ctx.strokeStyle = 'rgba(200, 220, 255, 0.8)'; ctx.lineWidth = 2.5;
                    data.particles.forEach(p => { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - p.l); ctx.stroke(); });
                    if (activePowerUp.type === 'heavy_rain') {
                        ctx.fillStyle = `rgba(0, 0, 0, ${data.skyDarkness})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        if (data.lightningDuration > 0) {
                            const flashAlpha = Math.min(1, data.lightningDuration / 10);
                            ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 3;
                            if (data.lightningBolts) {
                                data.lightningBolts.forEach(bolt => {
                                    if (bolt.layer === 'front') { ctx.beginPath(); bolt.path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke(); }
                                });
                            }
                        }
                    }
                    break;
                case 'snow':
                    data.particles.forEach(p => drawSnowflake(p.x, p.y, p.r, p.rot, p.shape));
                    break;
                case 'wind':
                    const angle = 70 * Math.PI / 180;
                    const cosAngle = Math.cos(angle);
                    const sinAngle = Math.sin(angle);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 1;
                    data.particles.forEach(p => {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p.x - p.l * cosAngle * 0.5, p.y + p.l * sinAngle * 0.5); // Make wind lines gentler
                        ctx.stroke();
                    });
                    
                    data.papers.forEach(p => {
                        ctx.fillStyle = '#d7ccc8';
                        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                        ctx.fillRect(-10, -5, 20, 10);
                        ctx.restore();
                    });
                    data.leaves.forEach(p => {
                        ctx.fillStyle = '#8d6e63';
                        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                        ctx.beginPath();
                        ctx.moveTo(0, -5); ctx.quadraticCurveTo(5, 0, 0, 5); ctx.quadraticCurveTo(-5, 0, 0, -5);
                        ctx.fill();
                        ctx.restore();
                    });
                    break;
                case 'fog':
                    const fogDensity = isDay ? 0.4 : 0.2;
                    data.blobs.forEach(b => {
                        ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha * fogDensity})`;
                        ctx.filter = 'blur(15px)';
                        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
                    });
                    ctx.filter = 'none';
                    break;
                case 'break_pipe':
                    if (data.state === 'cracking' && data.pipe) {
                        ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.5;
                        const drawCrackPath = (path) => {
                            const progressIndex = Math.floor(path.length * data.crackProgress);
                            if (progressIndex < 2) return;
                            ctx.save();
                            ctx.translate(data.pipe.x, 0);
                            ctx.beginPath();
                            ctx.moveTo(path[0].x, path[0].y);
                            for (let i = 1; i < progressIndex; i++) {
                                ctx.lineTo(path[i].x, path[i].y);
                            }
                            ctx.stroke();
                            ctx.restore();
                        };
                        drawCrackPath(data.cracks.top);
                        drawCrackPath(data.cracks.bottom);
                    }
                    if (data.state === 'shattering') {
                        data.debris.forEach(d => {
                            if (d.alpha > 0) {
                                ctx.fillStyle = `rgba(224, 116, 143, ${d.alpha})`;
                                ctx.save();
                                ctx.translate(d.x, d.y); ctx.rotate(d.rot);
                                ctx.beginPath(); ctx.moveTo(d.shape[0].x, d.shape[0].y);
                                for (let j = 1; j < d.shape.length; j++) ctx.lineTo(d.shape[j].x, d.shape[j].y);
                                ctx.closePath(); ctx.fill();
                                ctx.restore();
                            }
                        });
                    }
                    break;
                case 'image_blink':
                    if (data.img.complete) {
                        const pulse = (Math.sin(activePowerUp.duration * 0.04) + 1) / 2;
                        ctx.globalAlpha = pulse * 0.85;
                        ctx.drawImage(data.img, 0, 0, canvas.width, canvas.height);
                    }
                    break;
            }
            ctx.restore();
        }

        // --- MAIN DRAW FUNCTION ---

        function draw() {
            ctx.save();
            if (screenShake.duration > 0) {
                screenShake.duration--;
                const dx = (Math.random() - 0.5) * screenShake.intensity;
                const dy = (Math.random() - 0.5) * screenShake.intensity;
                ctx.translate(dx, dy);
            }

            drawBackground();
            backgroundPowerUpLayer.draw();
            drawBirds();

            if (gameState === 'playing' || gameState === 'over') {
                const pipeCapHeight = 25;
                const pipeCapWidth = pipeWidth + 8;
                const pipeBorderWidth = 2;
                const pipeBorderColor3D = "#8c4a5c";
                const capRadius = 8;

                for (let p of pipes) {
                    if (p.isFalling) continue;
                    const pipeCapX = p.x - (pipeCapWidth - pipeWidth) / 2;
                    const gradient = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                    gradient.addColorStop(0, '#ffc1d1'); gradient.addColorStop(0.5, '#ff85a2'); gradient.addColorStop(1, '#e0748f');

                    const topPipeCapY = p.y - pipeCapHeight;
                    const bottomPipeY = p.y + pipeGap;
                    const bottomPipeBodyY = bottomPipeY + pipeCapHeight;

                    ctx.fillStyle = gradient;
                    ctx.fillRect(p.x, 0, pipeWidth, topPipeCapY);
                    fillRoundedRect(pipeCapX, topPipeCapY, pipeCapWidth, pipeCapHeight, capRadius);
                    ctx.fillRect(p.x, bottomPipeBodyY, pipeWidth, canvas.height - bottomPipeBodyY);
                    fillRoundedRect(pipeCapX, bottomPipeY, pipeCapWidth, pipeCapHeight, capRadius);

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fillRect(p.x + 5, 0, 10, topPipeCapY);
                    ctx.fillRect(p.x + 5, bottomPipeBodyY, 10, canvas.height - bottomPipeBodyY);
                    ctx.fillRect(pipeCapX + 5, topPipeCapY, 10, pipeCapHeight);
                    ctx.fillRect(pipeCapX + 5, bottomPipeY, 10, pipeCapHeight);

                    ctx.strokeStyle = pipeBorderColor3D; ctx.lineWidth = pipeBorderWidth;
                    ctx.beginPath();
                    ctx.moveTo(p.x + pipeBorderWidth / 2, 0); ctx.lineTo(p.x + pipeBorderWidth / 2, topPipeCapY);
                    ctx.moveTo(p.x + pipeWidth - pipeBorderWidth / 2, 0); ctx.lineTo(p.x + pipeWidth - pipeBorderWidth / 2, topPipeCapY);
                    ctx.moveTo(p.x + pipeBorderWidth / 2, bottomPipeBodyY); ctx.lineTo(p.x + pipeBorderWidth / 2, canvas.height);
                    ctx.moveTo(p.x + pipeWidth - pipeBorderWidth / 2, bottomPipeBodyY); ctx.lineTo(p.x + pipeWidth - pipeBorderWidth / 2, canvas.height);
                    ctx.stroke();

                    strokeRoundedRect(pipeCapX, topPipeCapY, pipeCapWidth, pipeCapHeight, capRadius);
                    strokeRoundedRect(pipeCapX, bottomPipeY, pipeCapWidth, pipeCapHeight, capRadius);

                    if (p.hasQuestionMark) {
                        drawQuestionMark(p.x + pipeWidth / 2, p.y + pipeGap / 2);
                    }
                }
            }
            
            drawGift();

            activeParticles.forEach(effect => {
                effect.particles.forEach(p => {
                    if (p.alpha > 0) {
                        ctx.fillStyle = effect.color + p.alpha + ')';
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                    }
                });
            });

            drawForegroundPowerUp();

            ctx.save();
            const maxUpwardRotation = -25 * Math.PI / 180;
            const maxDownwardRotation = 90 * Math.PI / 180;
            let rotation = catVelocity * 0.08;
            rotation = Math.max(maxUpwardRotation, Math.min(maxDownwardRotation, rotation));
            ctx.translate(catX + catWidth / 2, catY + catHeight / 2);
            ctx.rotate(rotation); ctx.scale(-1, 1);
            ctx.drawImage(catImg, -catWidth / 2, -catHeight / 2, catWidth, catHeight);
            ctx.restore();

            if (hint.alpha > 0) {
                ctx.fillStyle = `rgba(100, 100, 100, ${hint.alpha * 0.7})`;
                fillRoundedRect(20, canvas.height * 2/5 - 25, canvas.width - 40, 50, 10);
                ctx.fillStyle = `rgba(255, 255, 255, ${hint.alpha})`;
                ctx.font = '18px "Comic Sans MS", cursive, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(hint.text, canvas.width / 2, canvas.height * 2/5 + 6);
            }

            ctx.fillStyle = 'white'; ctx.textAlign = 'center';
            if (gameState === 'start') {
                ctx.fillStyle = '#ff85a2';
                ctx.font = '22px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText('Click or press Space to play', canvas.width / 2, canvas.height / 2 + 70);
            } else if (gameState === 'playing') {
                ctx.font = '48px "Comic Sans MS", cursive, sans-serif';
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 5;
                ctx.strokeText(score, canvas.width / 2, 70);
                ctx.fillText(score, canvas.width / 2, 70);
            } else if (gameState === 'over') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '48px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 90);
                ctx.font = '30px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 - 35);
                ctx.fillText(`High Score: ${highScore}`, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillStyle = '#ff85a2';
                ctx.font = '22px "Comic Sans MS", cursive, sans-serif';
                ctx.fillText('Click or press Space to play', canvas.width / 2, canvas.height / 2 + 70);
            }

            ctx.restore(); // for screen shake
        }

        catImg.onload = initialize;

    </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About</title>

  <style>
    /* Font declarations */
    @font-face {
      font-family: 'PixelFont';
      src: url('fontpixel.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'fontpixel1';
      src: url('fontpixel1.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'CandySeason';
      src: url('candyseason.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* Global styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'PixelFont', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background-color: #000; /* Fallback color */
    }

    /* Wind effect for background */
    body::before {
      content: '';
      position: fixed;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      background: url('bgabout.jpg') no-repeat center center;
      background-size: cover;
      z-index: -1;
      animation: windEffect 80s ease-in-out infinite alternate;
    }

    /* Container for initial view */
    .container {
      width: 100%;
      max-width: 980px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
    }

    .page-title {
      position: absolute;
      top: 40px;
      left: 40px;
      font-family: 'fontpixel1', sans-serif;
      font-size: 72px;
      color: white;
      text-shadow: 4px 4px 0 #222;
      z-index: 10;
    }

    /* Button styling (retained from original) */
    .btn,
    .btn:link,
    .btn:visited {
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      appearance: none;
      border: 0;
      padding: 14px 22px;
      min-width: 120px;
      text-align: center;
      font-size: 16px;
      font-family: 'CandySeason', sans-serif;
      cursor: pointer;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      color: #222;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      transition: transform 140ms ease, box-shadow 140ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover,
    .btn:focus {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.45);
      outline: none;
    }

    .btn:active { transform: translateY(0); }

    .btn:focus-visible {
      outline: 3px solid rgba(255,255,255,0.7);
      outline-offset: 4px;
    }

    /* --- Display 2 Styles --- */

    #display2 {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative; /* For absolute positioning of children */
    }

    .desktop-window {
      width: 100%;
      max-width: 800px;
      height: 550px;
      max-height: 90vh;
      background: #c0c0c0; /* Old Windows grey */
      border: 2px solid;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      transition: width 0.4s ease, height 0.4s ease, transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
    }
    .desktop-window.is-small {
      width: 600px;
      height: 450px;
      max-height: 80vh;
    }
    .desktop-window.is-minimized {
      transform: translateY(100vh) scale(0.5);
      opacity: 0;
      pointer-events: none;
    }
    .desktop-window.interaction-started {
      cursor: default;
    }

    .title-bar {
      background: linear-gradient(to right, #000080, #1084d0); /* Old Windows blue */
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'fontpixel1', sans-serif;
      font-size: 20px; /* Increased size */
      color: #fff;
      user-select: none;
    }

    .window-controls {
      display: flex;
      gap: 3px;
    }

    .control-btn {
      width: 20px;
      height: 20px;
      background-color: #c0c0c0;
      border: 1px solid;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 16px;
      color: #000;
      cursor: pointer;
    }
    .control-btn.minus::after { content: '─'; line-height: 1; }
    .control-btn.square::after { content: '❐'; font-size: 20px; line-height: 1; } /* Double square icon */
    .control-btn.close::after { content: 'X'; line-height: 1; }

    .window-body {
      flex-grow: 1;
      padding: 3px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .desktop-window.is-small .window-body {
      overflow: auto;
    }
    .desktop-window.is-small .window-body::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    .desktop-window.is-small .window-body::-webkit-scrollbar-track {
      background: #c0c0c0;
      border-left: 1px solid #404040;
      border-top: 1px solid #404040;
    }
    .desktop-window.is-small .window-body::-webkit-scrollbar-thumb {
      background: #ff69b4;
      border: 1px solid;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
    }

    .running-belt-container {
      width: 100%;
      overflow: hidden;
      margin-top: 11px; /* Approx 0.3cm */
    }

    .belt {
      display: flex;
      width: fit-content;
      animation: scroll 30s linear infinite;
    }

    .belt-gif {
      height: 32px; /* Reduced size */
      margin: 0 6px;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes windEffect {
      from { transform: translate(0, 0) scale(1.05) rotate(-0.5deg); }
      to { transform: translate(2%, 1%) scale(1.05) rotate(0.5deg); }
    }

    @keyframes poof {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.5;
      }
      100% {
        transform: scale(0);
        opacity: 0;
      }
    }
    body.poof-bg::before {
      animation: poof 0.5s ease-in forwards;
    }
    
    @keyframes unpoof {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1.05) rotate(-0.5deg);
        opacity: 1;
      }
    }
    body.unpoofing::before {
      animation: unpoof 0.5s ease-out forwards;
    }

    .main-pane {
      flex-grow: 3.3; /* 3.3/4 of the space */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
    }

    .slide-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between; /* Positions text at bottom */
      cursor: pointer;
    }
    .slide1-images {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #slide1-content > .main-text {
      transform: translateY(22.7px); /* 41.9px - 0.5cm */
    }

    .main-text {
      font-family: 'fontpixel1', sans-serif;
      font-size: 24px; /* Reduced size */
      color: #000;
      text-shadow: 1px 1px #fff;
      text-align: center;
    }

    .qa-container {
      font-family: 'fontpixel1', sans-serif;
      font-size: 26px;
      color: #000;
      line-height: 1.8;
      width: 100%;
      text-align: left; /* Aligned left */
      padding-top: 20px;
    }
    .qa-option {
      cursor: pointer;
      padding: 4px 8px;
    }
    .qa-option:hover {
      background-color: #000080;
      color: #fff;
    }

    .main-gif { /* Moved 3cm to the left */
      max-width: 350px; /* Reduced size a bit */
      max-height: 350px; /* Reduced size a bit */
      image-rendering: pixelated; /* Preserve pixel quality */
      transform: translateX(-38.4px);
    }
    .side-img {
      max-width: 400px; /* Increased size a bit more */
      image-rendering: pixelated; /* Preserve pixel quality */
      transform: translateY(2cm);
    }

    .lower-pane {
      flex-grow: 0.7; /* 0.7/4 of the space */
      border-top: 4px solid #ff69b4; /* Thicker pink line */
      display: flex;
      /* align-items: center; Removed to allow scrolling from top */
      font-family: 'fontpixel1', sans-serif;      
      font-size: 28px;
      color: #000;
      text-shadow: 1px 1px #fff;
      padding: 10px;
      overflow-y: auto;
    }

    .lower-pane::-webkit-scrollbar {
      width: 12px;
    }
    .lower-pane::-webkit-scrollbar-track {
      background: #c0c0c0;
      border-left: 1px solid #404040;
    }
    .lower-pane::-webkit-scrollbar-thumb {
      background: #ff69b4;
      border: 1px solid;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
    }

    /* --- New Styles for Display 3 and Minimized Bar --- */
    #display3 {
      display: none; /* Initially hidden */
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: 'fontpixel1', sans-serif;
      font-size: 32px;
    }
    #return-btn-d3 {
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s;
      width: 180px; /* Increased size */
      height: auto;
      image-rendering: pixelated;
    }
    #return-btn-d3:hover {
      transform: scale(1.1);
    }

    #minimized-taskbar-item {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%); /* Centered */
      display: none; /* Initially hidden */
      align-items: center;
      gap: 8px;
      background: #c0c0c0;
      border: 2px outset #fff;
      padding: 5px 10px;
      cursor: pointer;
      font-family: 'fontpixel1', sans-serif;
    }

    /* Clicked effect */
    .press-effect:active, .press-effect.clicked {
      transform: scale(0.95);
      filter: brightness(0.9);
      transition: transform 50ms ease, filter 50ms ease;
    }

  </style>
</head>
<body>

  <h1 class="page-title">About</h1>
  <!-- Display 1: Initial "Enter" button -->
  <main id="display1" class="container" role="main">
    <a href="#" id="enter-btn" class="btn" role="button">Enter</a>
  </main>

  <!-- Display 2: Desktop Window (initially hidden) -->
  <main id="display2" role="main">
    <div id="desktop-window" class="desktop-window">
      <div id="title-bar" class="title-bar">
        <span id="title-text" class="title-text">Help Desk</span>
        <div class="window-controls">
          <div id="minimize-btn" class="control-btn minus press-effect"></div>
          <div id="maximize-btn" class="control-btn square press-effect"></div>
          <div id="close-btn" class="control-btn close press-effect"></div>
        </div>
      </div>
      <div id="window-body" class="window-body">
        <div class="running-belt-container">
          <div class="belt" id="gif-belt">
            <!-- GIFs are injected here by JavaScript -->
          </div>
        </div>
        <div id="main-pane" class="main-pane">
          <img src="hd.gif" alt="Animated pixel art" class="main-gif">
          <div id="slide1-content" class="slide-content">
            <img src="hdd.jpg" alt="Pixel art landscape" class="side-img">
            <p class="main-text">[SPACE] or Click anywhere to begin</p>
          </div>
          <div id="slide2-content" class="slide-content" style="display: none;">
          </div>
        </div>
        <div id="lower-pane" class="lower-pane" style="justify-content: center; text-align: center;">
          <p id="dynamic-text">Welcome to astroblitz25!</p>
        </div>
      </div>
    </div>
    <div id="minimized-taskbar-item" class="press-effect">
      <img src="hd99.gif" alt="Restore Help Desk" height="30" class="press-effect">
      <span>Help Desk</span>
    </div>
  </main>

  <!-- Display 3: Extinguished Screen (initially hidden) -->
  <main id="display3">
    <img src="hd98.gif" alt="Extinguished animation">
    <p>Uh oh... Extinguished!</p>
    <img src="hd99.gif" alt="Return" id="return-btn-d3" class="press-effect">
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pageTitle = document.querySelector('.page-title');
      // --- Display Toggle Logic ---
      const display1 = document.getElementById('display1');
      const display2 = document.getElementById('display2');
      const display3 = document.getElementById('display3');
      const enterBtn = document.getElementById('enter-btn');

      function showDisplay2(e) {
        if (e) e.preventDefault();
        pageTitle.style.display = 'none';
        display1.style.display = 'none';
        display2.style.display = 'flex';
      }
      enterBtn.addEventListener('click', showDisplay2);

      // --- Window Elements ---
      const desktopWindow = document.getElementById('desktop-window');
      const body = document.body;
      const mainPane = document.getElementById('main-pane');
      const lowerPaneText = document.getElementById('dynamic-text');
      const closeBtn = document.getElementById('close-btn');
      const maximizeBtn = document.getElementById('maximize-btn');
      const minimizeBtn = document.getElementById('minimize-btn');
      const minimizedBar = document.getElementById('minimized-taskbar-item');
      const returnBtnD3 = document.getElementById('return-btn-d3');
      const slide1 = document.getElementById('slide1-content');
      const slide2 = document.getElementById('slide2-content');

      // --- State Management ---
      let windowSlide = 'initial'; // 'initial' or 'qa'
      let qaMode = null; // null, 'about', 'tips', 'who', or 'thanks'
      let aboutIndex = 0;
      let tipsIndex = 0;

      const aboutParagraphs = [
        `This is a special site crafted for an extraordinary 22-year-old girl on her latest birthday.`,
        `One of her deepest passions is nature—and simply losing herself in the refreshing breeze of the cosmos. That's why the creator of this site built this little playground, where she can gaze at twinkling stars, wander through lush jungles, and journey from shimmering seas to towering mountains... all through the gentle lens of Mother Nature in hidden corners of the universe.`,
        `Amidst this endless cosmic wonder, there are also heartfelt glimpses of human life's own beauty.`,
        `It can also be her cozy retreat to unwind when she's feeling worn out or just in need of a fresh escape.`
      ];

      const tipsParagraphs = [
        'The window controls (of this box you’re currently interacting with) are fully functional!',
        'Press “q” to go back to the previous displays of the web/boxes<br><small>(only applied for some)</small>',
        'Turn volume on since there’re some sections with music!'
      ];

      const whoAmIAnswer = "I'm a cool samurai cat drawn in Ghibli style - just like 60% of the theme of this site. I'm here to answer your FAQs - and to make the web looks cooler.";
      const thanksAnswer = "Thanks for stopping by! Feel free to meet me anytime for further assistance.";

      // --- Clicked Effect Listeners ---
      document.addEventListener('mousedown', e => e.target.closest('.press-effect')?.classList.add('clicked'));
      document.addEventListener('mouseup', () => document.querySelectorAll('.clicked').forEach(el => el.classList.remove('clicked')));
      document.addEventListener('mouseleave', e => e.target.closest('.press-effect')?.classList.remove('clicked'), true);


      // --- GIF Belt Generation ---
      const gifBelt = document.getElementById('gif-belt');
      if (gifBelt) {
        const baseGifs = [
          'hd4.gif', 'hd5.gif', 'hd6.gif', 'hd7.gif',
          'hd8.gif', 'hd9.gif', 'hd10.gif', 'hd11.gif', 'hd12.gif'
        ];
        const specialGifs = ['hd1.gif', 'hd2.gif'];

        let allGifs = [...baseGifs];

        // Insert special GIFs into random positions
        specialGifs.forEach(gif => {
          const randomIndex = Math.floor(Math.random() * (allGifs.length + 1));
          allGifs.splice(randomIndex, 0, gif);
        });

        // Create image elements
        let beltHTML = '';
        allGifs.forEach(gifSrc => {
          beltHTML += `<img src="${gifSrc}" alt="" class="belt-gif">`;
        });

        // Duplicate the sequence for a seamless scrolling animation loop
        gifBelt.innerHTML = beltHTML + beltHTML;
      }

      // --- Window Controls Logic ---
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        body.classList.add('poof-bg');
        setTimeout(() => {
          display2.style.display = 'none';
          display3.style.display = 'flex';
        }, 500); // Match animation duration
      });

      returnBtnD3.addEventListener('click', () => {
          display3.style.display = 'none';
          display2.style.display = 'flex';
          
          // The 'poof-bg' class is still on the body from the close action.
          // We remove it to stop it from interfering.
          body.classList.remove('poof-bg');
          
          // Add a class to trigger the reverse animation.
          body.classList.add('unpoofing');
          
          // After the animation is done, remove the class so the default windEffect can resume.
          setTimeout(() => body.classList.remove('unpoofing'), 500); // Must match the animation duration
      });

      maximizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        desktopWindow.classList.toggle('is-small');
      });

      minimizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        desktopWindow.classList.add('is-minimized');
        minimizedBar.style.display = 'flex';
      });

      minimizedBar.addEventListener('click', () => {
        desktopWindow.classList.remove('is-minimized');
        minimizedBar.style.display = 'none';
      });

      // --- Slide and Content Logic ---
      function setSlide(slideName) {
        windowSlide = slideName;
        if (slideName === 'initial') {
          slide1.style.display = 'flex';
          slide2.style.display = 'none';
          lowerPaneText.innerHTML = 'Welcome to astroblitz25!';
          qaMode = null;
        } else if (slideName === 'qa') {
          slide1.style.display = 'none';
          slide2.style.display = 'flex';
          slide2.innerHTML = `
          <div class="qa-container">
            <div class="qa-option press-effect" data-question="about">▶ What is this site about?</div>
            <div class="qa-option press-effect" data-question="tips">▶ What are some useful tips for using this sites?</div>
            <div class="qa-option press-effect" data-question="who">▶ Who are you?</div>
            <div class="qa-option press-effect" data-question="thanks">▶ I’m good for now. Thanks</div>
          </div>
          <p class="main-text" style="transform: translateY(0.5cm);">[SPACE] or Click anywhere to continue</p>
          `;
          lowerPaneText.innerHTML = 'What do you want help with?';
        }
      }

      function handleInteraction() {
        if (windowSlide === 'initial') {
          setSlide('qa');
        } else if (windowSlide === 'qa') {
          if (qaMode === 'about') {
            aboutIndex = (aboutIndex + 1) % aboutParagraphs.length;
            lowerPaneText.innerHTML = aboutParagraphs[aboutIndex];
          } else if (qaMode === 'tips') {
            tipsIndex = (tipsIndex + 1) % tipsParagraphs.length;
            lowerPaneText.innerHTML = tipsParagraphs[tipsIndex];
          }
        }
      }

      // --- Event Listeners for Main Interaction ---
      desktopWindow.addEventListener('click', (e) => {
        // If click is on the window body but not on a specific control
        if (e.target.closest('.window-body') && !e.target.closest('.qa-option, .control-btn')) {
          handleInteraction();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (display2.style.display !== 'flex') return;

        if (e.key === ' ') {
          e.preventDefault();
          handleInteraction();
        } else if (e.key.toLowerCase() === 'q') {
          if (windowSlide === 'qa') {
            setSlide('initial');
          }
        }
      });

      slide2.addEventListener('click', (e) => {
        if (e.target.matches('.qa-option')) {
          const question = e.target.dataset.question;
          if (question === 'about') {
            qaMode = 'about';
            aboutIndex = 0;
            lowerPaneText.innerHTML = aboutParagraphs[aboutIndex];
          } else if (question === 'tips') {
            qaMode = 'tips';
            tipsIndex = 0;
            lowerPaneText.innerHTML = tipsParagraphs[tipsIndex];
          } else if (question === 'who') {
            qaMode = 'who';
            lowerPaneText.innerHTML = whoAmIAnswer;
          } else if (question === 'thanks') {
            qaMode = 'thanks';
            lowerPaneText.innerHTML = thanksAnswer;
          }
        }
      });

      // --- Keyboard Accessibility ---
      enterBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          showDisplay2();
        }
      });
    });
  </script>
</body>
</html>
